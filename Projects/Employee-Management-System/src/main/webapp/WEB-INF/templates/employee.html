
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employee List</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        color: #1f2937;
        padding: 40px 20px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }

    h1 {
        font-size: 28px;
        color: #1e3a8a;
    }

    .add-btn {
        display: inline-block;
        padding: 11px 18px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: background 0.2s;
    }

    .add-btn:hover {
        background: #1d4ed8;
    }

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
    }

    thead {
        background: #1e3a8a;
        color: white;
    }

    th, td {
        padding: 15px 16px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
    }

    th {
        font-size: 14px;
        letter-spacing: 0.3px;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .salary {
        font-weight: bold;
        color: #047857;
    }

    .actions {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .update-btn {
        display: inline-block;
        padding: 8px 12px;
        background: #e0ecff;
        color: #1d4ed8;
        text-decoration: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
    }

    .update-btn:hover {
        background: #c7dcff;
    }

    .delete-btn {
        padding: 8px 12px;
        background: #fee2e2;
        color: #b91c1c;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
    }

    .delete-btn:hover {
        background: #fecaca;
    }

    .empty-message {
        text-align: center;
        padding: 30px;
        color: #6b7280;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 10px;
        }

        .container {
            padding: 20px 12px;
        }

        h1 {
            font-size: 23px;
        }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Employee List</h1>

    <a class="add-btn" th:href="@{/employee/add}">
      + Add Employee
    </a>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>

        <td th:text="${employee.name}"></td>

        <td th:text="${employee.dept}"></td>

        <td class="salary"
            th:text="${employee.salary}">
        </td>

        <td>
          <div class="actions">

            <a class="update-btn"
               th:href="@{/employee/update(id=${employee.id})}">
              Update
            </a>

            <form method="POST"
                  th:action="@{/employee/delete}"
                  onsubmit="return confirm('Are you sure you want to delete this employee?');">

              <input type="hidden"
                     name="id"
                     th:value="${employee.id}">

              <button class="delete-btn"
                      type="submit">
                Delete
              </button>
            </form>

          </div>
        </td>
      </tr>

      <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="5" class="empty-message">
          No employees found. Click "Add Employee" to get started.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
