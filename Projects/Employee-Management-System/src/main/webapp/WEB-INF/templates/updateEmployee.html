
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .employee-id {
            display: inline-block;
            color: #4b5563;
            background: #eff6ff;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button,
        .cancel-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="heading">
        <h1>Update Employee</h1>

        <span class="employee-id">
                Employee ID:
                <span th:text="${employee.id}">1</span>
            </span>
    </div>

    <form method="post"
          th:action="@{/employee/saveas}"
          th:object="${employee}">

        <!-- Hidden employee ID: required for updating the correct record -->
        <input type="hidden" id="id" name="id" th:value="*{id}">

        <div class="form-group">
            <label for="name">Employee Name</label>
            <input
                    id="name"
                    type="text"
                    name="name"
                    th:value="*{name}"
                    placeholder="Enter employee name"
                    required>
        </div>

        <div class="form-group">
            <label for="dept">Department</label>
            <input
                    id="dept"
                    type="text"
                    name="dept"
                    th:value="*{dept}"
                    placeholder="Enter department"
                    required>
        </div>

        <div class="form-group">
            <label for="salary">Salary (₹)</label>
            <input
                    id="salary"
                    type="number"
                    name="salary"
                    th:value="*{salary}"
                    min="0"
                    step="any"
                    placeholder="Enter salary"
                    required>
        </div>

        <div class="actions">
            <button type="submit">Save Changes</button>

            <a class="cancel-btn" th:href="@{/employees}">
                Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
